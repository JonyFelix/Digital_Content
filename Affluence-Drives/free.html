<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Clips | Affluence Drives</title>
  <style>
    /* Reset and base styles */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      line-height: 1.6;
    }

    /* Navbar */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      background-color: #000;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-bar ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }
    .nav-bar a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }
    .nav-bar a:hover,
    .nav-bar a.active {
      color: gold;
    }

    /* Hero Section */
    .page-hero {
      height: 40vh;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), #000),
                  url('https://picsum.photos/id/1015/1200/600') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .page-hero h1 {
      font-size: 3.5rem;
      color: gold;
      text-shadow: 0 0 10px gold;
    }

    /* Search */
    .search-container {
      margin: 40px auto;
      text-align: center;
    }
    .search-container input {
      padding: 12px 20px;
      width: 80%;
      max-width: 500px;
      border: 2px solid gold;
      border-radius: 25px;
      background: #111;
      color: white;
      font-size: 1.1rem;
    }

    /* Clips */
    .clip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 0 5% 60px;
    }
    .clip-card {
      background-color: #111;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      height: 350px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .clip-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px gold;
    }

    .clip-card img,
    .clip-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 10px;
    }
    .clip-card video {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .clip-card:hover video {
      opacity: 1;
    }

    .hover-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
    }
    .clip-card:hover .hover-overlay {
      opacity: 1;
    }
    .play-icon {
      font-size: 3rem;
      color: gold;
      margin-bottom: 10px;
    }
    .direct-download-btn {
      background-color: gold;
      color: #000;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    /* Title inside card */
    .clip-card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 15px;
      z-index: 3;
      text-align: center;
    }
    .clip-card h3 {
      color: gold;
      font-size: 1.2rem;
      margin: 0;
    }

    /* Modal */
    .clip-preview-modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .clip-preview-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .clip-preview-modal-content {
      background: #111;
      padding: 20px;
      border-radius: 10px;
      max-width: 90vw;
      max-height: 90vh;
    }
    .clip-preview-modal-content video {
      width: 100%;
      border-radius: 10px;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    footer {
      padding: 40px 5%;
      background: #000;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <div><a href="#" class="active">Free Clips</a></div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Premium</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>

  <section class="page-hero">
    <h1>Free Clips</h1>
  </section>

  <div class="search-container">
    <input type="text" placeholder="Search clips...">
  </div>

  <section class="clip-grid">
    <!-- Card 1 -->
    <div class="clip-card" onclick="openModal('https://www.w3schools.com/html/mov_bbb.mp4')">
      <div class="clip-card-inner">
        <img src="https://picsum.photos/id/1005/400/300" alt="clip" />
        <video muted loop>
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <div class="hover-overlay">
          <div class="play-icon">&#9658;</div>
          <a class="direct-download-btn" href="https://www.w3schools.com/html/mov_bbb.mp4" download>Download</a>
        </div>
        <div class="clip-card-info"><h3>Nature Drive</h3></div>
      </div>
    </div>
    <!-- Add more clip-cards below as needed -->
  </section>

  <!-- Modal -->
  <div class="clip-preview-modal-overlay" id="clipModal">
    <div class="clip-preview-modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <video id="previewVideo" controls></video>
    </div>
  </div>

  <footer>
    <h3>Affluence Drives</h3>
    <p>&copy; 2025 Affluence Drives. All rights reserved.</p>
  </footer>

  <script>
    function openModal(videoUrl) {
      const modal = document.getElementById('clipModal');
      const video = document.getElementById('previewVideo');
      modal.classList.add('active');
      video.src = videoUrl;
      video.play();
    }

    function closeModal() {
      const modal = document.getElementById('clipModal');
      const video = document.getElementById('previewVideo');
      modal.classList.remove('active');
      video.pause();
      video.src = '';
    }
  </script>

</body>
</html>
