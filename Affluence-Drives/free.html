<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Clips | Affluence Drives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            scroll-padding-top: 100px;
            background-color: #000;
            color: white;
            font-family: 'Roboto', sans-serif;
        }

        /* Navbar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-img {
            width: 50px;
        }

        .nav-bar ul {
            display: flex;
            list-style: none;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .nav-bar a {
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .nav-bar a:hover {
            color: gold;
        }

        /* Active navigation link for the current page */
        .nav-bar a.active {
            color: gold;
        }

        /* Hero Section for Free Clips Page */
        .page-hero {
            position: relative;
            height: 40vh; /* Shorter than main hero for content pages */
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('assets/images/hero-bg.jpg') no-repeat center center/cover;
        }

        .page-hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            color: #fff;
        }

        .page-hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: gold; /* Gold color for the main title */
            text-shadow: 0 0 6px #f0c420aa, 0 0 12px #f0c42088, 0 0 20px #f0c42055; /* Glow effect */
        }

        /* Content Section */
        .content-section {
            padding: 60px 5%;
            background-color: #000;
            color: white;
            text-align: center; /* Center content within the section */
        }

        .section-title {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: white; /* White color for section titles */
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 40px;
            text-align: center;
        }

        .search-container input[type="text"] {
            width: 80%;
            max-width: 500px;
            padding: 12px 20px;
            border: 2px solid gold;
            border-radius: 25px;
            background-color: #1a1a1a;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .search-container input[type="text"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px gold;
        }

        /* Clip Grid */
        .clip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Responsive grid for clips */
            gap: 30px; /* Space between clip cards */
            justify-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .clip-card {
            background-color: #111; /* Darker background for cards */
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* Subtle shadow */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%; /* Ensure cards take full width of their grid column */
            max-width: 350px; /* Max width for larger screens */
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer; /* Indicate clickable */
            position: relative; /* For play icon overlay */
        }

        .clip-card:hover {
            transform: translateY(-5px); /* Slight lift on hover */
            box-shadow: 0 0 20px gold; /* Gold glow on hover */
        }

        .clip-card img {
            width: 100%;
            height: 350px; /* Fixed height for consistent thumbnail size */
            object-fit: cover; /* Cover the area, cropping if necessary */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Separator */
            margin-bottom: 15px;
        }

        /* Play icon overlay */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 350px; /* Match image height */
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent overlay */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .clip-card:hover .play-overlay {
            opacity: 1;
        }

        .play-overlay i {
            font-size: 4rem;
            color: gold;
            text-shadow: 0 0 10px rgba(240, 196, 32, 0.7);
        }


        .clip-card-info {
            padding: 0 15px 20px; /* Padding for text and button */
            width: 100%;
            text-align: center;
        }

        .clip-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: gold; /* Gold color for clip titles */
            margin-bottom: 10px;
            text-align: center;
        }

        .clip-card p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Button Styles (from index.html) */
        .btn {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1rem;
            margin: 0 10px;
            display: inline-block;
            cursor: pointer;
            transition: box-shadow 0.3s ease;
            user-select: none;
            text-transform: uppercase;
        }

        .silver-btn {
            background: #c0c0c0;
            color: #000;
            box-shadow: 0 0 8px 1px #eee;
        }

        .silver-btn:hover {
            box-shadow: 0 0 15px 4px #ddd;
        }

        /* Footer */
        footer {
            background-color: #000;
            color: #ccc;
            text-align: center;
            padding: 40px 5%;
            font-size: 0.95rem;
            line-height: 1.6;
            user-select: none;
        }

        footer h3 {
            color: white;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .footer-bottom {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Video Player Modal */
        .video-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Darker overlay */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000; /* Above everything else */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .video-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .video-modal-content {
            position: relative;
            background-color: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(240, 196, 32, 0.5); /* Gold glow for modal */
            padding: 20px;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-player-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Max width for the video player */
            aspect-ratio: 9 / 16; /* 9:16 aspect ratio for reels */
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-player-container video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensure video fits without cropping */
        }

        .video-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            z-index: 2010;
            transition: color 0.3s ease;
        }

        .video-modal-close:hover {
            color: gold;
        }

        .video-download-icon {
            position: absolute;
            top: 10px;
            right: 50px; /* Position next to close button */
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 2010;
            transition: color 0.3s ease;
        }

        .video-download-icon:hover {
            color: gold;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .page-hero-content h1 {
                font-size: 2.5rem;
            }
            .section-title {
                font-size: 1.8rem;
            }
            .nav-bar {
                flex-direction: column;
                padding: 15px 5%;
            }
            .nav-bar ul {
                margin-top: 15px;
                gap: 20px;
            }
            .search-container input[type="text"] {
                width: 90%;
            }
            .clip-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            }
            .video-modal-content {
                padding: 10px;
            }
            .video-download-icon {
                right: 40px;
            }
        }

        @media (max-width: 480px) {
            .page-hero-content h1 {
                font-size: 2rem;
            }
            .section-title {
                font-size: 1.5rem;
            }
            .clip-grid {
                grid-template-columns: 1fr; /* Stack cards on very small screens */
            }
            .video-download-icon {
                right: 30px;
                font-size: 1.5rem;
            }
            .video-modal-close {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="logo">
            <img src="assets/images/feature.png" alt="Logo" class="logo-img" />
        </div>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="free.html" class="active">FREE CLIPS</a></li>
            <li><a href="premium.html">PREMIUM CLIPS</a></li>
            <li><a href="about.html">ABOUT</a></li>
        </ul>
    </nav>

    <section class="page-hero">
        <div class="page-hero-content">
            <h1>FREE DAILY CLIPS</h1>
        </div>
    </section>

    <section id="free-clips-content" class="content-section">
        <h2 class="section-title">Download Your Daily Dose of Affluence</h2>

        <div class="search-container">
            <input type="text" id="clipSearch" placeholder="Search clips by tags (e.g., car, nature, luxury...)">
        </div>

        <div class="clip-grid" id="clipGrid">
            <p id="loadingMessage" style="color: #ccc; font-size: 1.2rem;">Loading clips...</p>
        </div>
    </section>

    <footer>
        <div class="footer-about">
            <h3>Affluence Drives</h3>
            <p>Your destination for cinematic luxury content that captivates and inspires.</p>
        </div>
        <div class="footer-bottom">
            &copy; 2025 Affluence Drives. All rights reserved.
        </div>
    </footer>

    <div class="video-modal-overlay" id="videoModal">
        <div class="video-modal-content">
            <button class="video-modal-close" id="closeModal">&times;</button>
            <a href="#" id="modalDownloadLink" class="video-download-icon" download>
                <i class="fas fa-arrow-down"></i> </a>
            <div class="video-player-container">
                <video id="modalVideo" autoplay loop muted playsinline></video>
            </div>
        </div>
    </div>

    <script>
        // Get elements
        const videoModal = document.getElementById('videoModal');
        const closeModalBtn = document.getElementById('closeModal');
        const modalVideo = document.getElementById('modalVideo');
        const modalDownloadLink = document.getElementById('modalDownloadLink');
        const clipGrid = document.getElementById('clipGrid');
        const clipSearchInput = document.getElementById('clipSearch');
        const loadingMessage = document.getElementById('loadingMessage');

        // Embedded clip data for local testing.
        // For a large number of clips (1000+), it's recommended to host this data
        // in a separate JSON file (e.g., clips.json) and fetch it,
        // as this improves page load performance and maintainability.
        let allClipsData = [
            {
                "id": "clip1",
                "thumbnail": "https://placehold.co/350x350/111/fff?text=CLIP+THUMBNAIL+1",
                "videoSrc": "YOUR_TELEGRAM_OR_DRIVE_LINK_1.mp4",
                "title": "Luxury Car Drive",
                "description": "A stunning reel showcasing a high-end luxury car on a scenic route. Uploaded: May 30, 2025",
                "tags": ["luxury", "car", "drive", "road", "speed"]
            },
            {
                "id": "clip2",
                "thumbnail": "https://placehold.co/350x350/111/fff?text=CLIP+THUMBNAIL+2",
                "videoSrc": "YOUR_TELEGRAM_OR_DRIVE_LINK_2.mp4",
                "title": "Elegant Lifestyle",
                "description": "Capturing moments of sophisticated living and opulent surroundings. Uploaded: May 29, 2025",
                "tags": ["elegant", "lifestyle", "fashion", "opulent"]
            },
            {
                "id": "clip3",
                "thumbnail": "https://placehold.co/350x350/111/fff?text=CLIP+THUMBNAIL+3",
                "videoSrc": "YOUR_TELEGRAM_OR_DRIVE_LINK_3.mp4",
                "title": "Architectural Grandeur",
                "description": "Explore the intricate details of breathtaking modern architecture. Uploaded: May 28, 2025",
                "tags": ["architecture", "building", "modern", "design", "city"]
            },
            {
                "id": "clip4",
                "thumbnail": "https://placehold.co/350x350/111/fff?text=CLIP+THUMBNAIL+4",
                "videoSrc": "YOUR_TELEGRAM_OR_DRIVE_LINK_4.mp4",
                "title": "Nature's Serenity",
                "description": "A tranquil journey through pristine landscapes, evoking peace and beauty. Uploaded: May 27, 2025",
                "tags": ["nature", "serenity", "landscape", "peace", "forest"]
            }
            // Add more clip objects here following the same structure
        ];

        // --- Dynamic Clip Loading ---
        function loadClips() {
            // Since data is embedded, we just display it directly
            displayClips(allClipsData);
            loadingMessage.style.display = 'none'; // Hide loading message
        }

        function createClipCard(clip) {
            const clipCard = document.createElement('div');
            clipCard.classList.add('clip-card');
            clipCard.setAttribute('data-video-src', clip.videoSrc);
            clipCard.setAttribute('data-tags', clip.tags.join(' ')); // Join tags with space for search

            clipCard.innerHTML = `
                <img src="${clip.thumbnail}" alt="${clip.title} Thumbnail">
                <div class="play-overlay">
                    <i class="fas fa-play"></i>
                </div>
                <div class="clip-card-info">
                    <h3>${clip.title}</h3>
                    <p>${clip.description}</p>
                </div>
            `;

            // Add event listener for opening modal to the newly created card
            clipCard.addEventListener('click', () => {
                openVideoModal(clip.videoSrc);
            });

            return clipCard;
        }

        function displayClips(clipsToDisplay) {
            clipGrid.innerHTML = ''; // Clear existing clips
            if (clipsToDisplay.length === 0) {
                clipGrid.innerHTML = '<p style="color: #ccc; font-size: 1.2rem;">No clips found matching your search.</p>';
                return;
            }
            clipsToDisplay.forEach(clip => {
                clipGrid.appendChild(createClipCard(clip));
            });
        }

        // --- Video Modal Logic ---

        // Function to open the modal
        function openVideoModal(videoSrc) {
            modalVideo.src = videoSrc;
            modalDownloadLink.href = videoSrc; // Set download link
            videoModal.classList.add('active');
            modalVideo.play(); // Start playing
        }

        // Function to close the modal
        function closeVideoModal() {
            modalVideo.pause(); // Pause video when closing
            modalVideo.src = ''; // Clear source to stop loading
            videoModal.classList.remove('active');
        }

        // Event listener for closing modal
        closeModalBtn.addEventListener('click', closeVideoModal);
        videoModal.addEventListener('click', (event) => {
            // Close modal if clicked outside the content area
            if (event.target === videoModal) {
                closeVideoModal();
            }
        });

        // --- Search Bar Logic ---

        clipSearchInput.addEventListener('keyup', () => {
            const searchTerm = clipSearchInput.value.toLowerCase().trim();
            const filteredClips = allClipsData.filter(clip => {
                const tags = clip.tags.join(' ').toLowerCase();
                return tags.includes(searchTerm);
            });
            displayClips(filteredClips);
        });

        // Load clips when the page loads
        document.addEventListener('DOMContentLoaded', loadClips);
    </script>
</body>
</html>
