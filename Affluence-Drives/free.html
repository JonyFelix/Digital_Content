<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Clips | Affluence Drives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            scroll-padding-top: 100px;
            background-color: #000;
            color: white;
            font-family: 'Roboto', sans-serif;
        }

        /* Navbar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-img {
            width: 50px;
        }

        .nav-bar ul {
            display: flex;
            list-style: none;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .nav-bar a {
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .nav-bar a:hover {
            color: gold;
        }

        /* Active navigation link for the current page */
        .nav-bar a.active {
            color: gold;
        }

        /* Hero Section for Free Clips Page */
        .page-hero {
            position: relative;
            height: 40vh; /* Shorter than main hero for content pages */
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('assets/images/hero-bg.jpg') no-repeat center center/cover;
        }

        .page-hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            color: #fff;
        }

        .page-hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: gold; /* Gold color for the main title */
            text-shadow: 0 0 6px #f0c420aa, 0 0 12px #f0c42088, 0 0 20px #f0c42055; /* Glow effect */
        }

        /* Content Section */
        .content-section {
            padding: 60px 5%;
            background-color: #000;
            color: white;
            text-align: center; /* Center content within the section */
        }

        .section-title {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: white; /* White color for section titles */
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 40px;
            text-align: center;
        }

        .search-container input[type="text"] {
            width: 80%;
            max-width: 500px;
            padding: 12px 20px;
            border: 2px solid gold;
            border-radius: 25px;
            background-color: #1a1a1a;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .search-container input[type="text"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px gold;
        }

        /* Clip Grid */
        .clip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Responsive grid for clips */
            gap: 30px; /* Space between clip cards */
            justify-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .clip-card {
            background-color: #111; /* Darker background for cards */
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* Subtle shadow */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%; /* Ensure cards take full width of their grid column */
            max-width: 350px; /* Max width for larger screens */
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer; /* Indicate clickable */
            position: relative; /* For play icon overlay */
            height: 350px; /* Fixed height for consistent card size */
        }

        .clip-card:hover {
            transform: translateY(-5px); /* Slight lift on hover */
            box-shadow: 0 0 20px gold; /* Gold glow on hover */
        }

        /* Thumbnail and Video Overlay (for hover play/download) */
        .clip-card-inner {
            position: relative;
            width: 100%;
            height: 100%; /* Take full height of clip-card */
            overflow: hidden;
            display: flex;
            flex-direction: column; /* To stack image/video and content */
        }

        .clip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
            opacity: 1; /* Thumbnail always visible */
            z-index: 0; /* Thumbnail always behind video overlay */
        }
        
        .clip-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0; /* Video is hidden by default */
            z-index: 1; /* Video appears on top of image on hover */
            transition: opacity 0.3s ease;
        }

        .clip-card:hover video {
            opacity: 1; /* Video visible on hover */
        }

        /* Play icon overlay (now also has download button) */
        .clip-card .hover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .clip-card:hover .hover-overlay {
            opacity: 1;
        }

        .hover-overlay .play-icon {
            font-size: 4rem;
            color: gold;
            text-shadow: 0 0 10px rgba(240, 196, 32, 0.7);
        }

        .direct-download-btn {
            background-color: gold;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .direct-download-btn:hover {
            background-color: #ffd700;
            box-shadow: 0 0 15px rgba(240, 196, 32, 0.8);
        }

        /* Clip Info (Title) - Always visible at the bottom */
        .clip-card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
            padding: 15px;
            text-align: center;
            z-index: 3; /* Ensure it's above thumbnail/video */
            opacity: 1; /* Always visible */
        }

        .clip-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: gold;
            margin-bottom: 5px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clip-card p {
            display: none; /* Description still hidden */
        }

        /* Button Styles (from index.html) - Note: not used in this direct download flow */
        .btn {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1rem;
            margin: 0 10px;
            display: inline-block;
            cursor: pointer;
            transition: box-shadow 0.3s ease;
            user-select: none;
            text-transform: uppercase;
            border: none;
        }

        .silver-btn {
            background: #c0c0c0;
            color: #000;
            box-shadow: 0 0 8px 1px #eee;
        }

        .silver-btn:hover {
            box-shadow: 0 0 15px 4px #ddd;
        }

        /* Footer */
        footer {
            background-color: #000;
            color: #ccc;
            text-align: center;
            padding: 40px 5%;
            font-size: 0.95rem;
            line-height: 1.6;
            user-select: none;
        }

        footer h3 {
            color: white;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .footer-bottom {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* No modal styles needed anymore */

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .page-hero-content h1 {
                font-size: 2.5rem;
            }
            .section-title {
                font-size: 1.8rem;
            }
            .nav-bar {
                flex-direction: column;
                padding: 15px 5%;
            }
            .nav-bar ul {
                margin-top: 15px;
                gap: 20px;
            }
            .search-container input[type="text"] {
                width: 90%;
            }
            .clip-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .page-hero-content h1 {
                font-size: 2rem;
            }
            .section-title {
                font-size: 1.5rem;
            }
            .clip-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="logo">
            <img src="assets/images/feature.png" alt="Logo" class="logo-img" />
        </div>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="free.html" class="active">FREE CLIPS</a></li>
            <li><a href="premium.html">PREMIUM CLIPS</a></li>
            <li><a href="about.html">ABOUT</a></li>
        </ul>
    </nav>

    <section class="page-hero">
        <div class="page-hero-content">
            <h1>FREE DAILY CLIPS</h1>
        </div>
    </section>

    <section id="free-clips-content" class="content-section">
        <h2 class="section-title">Download Your Daily Dose of Affluence</h2>

        <div class="search-container">
            <input type="text" id="clipSearch" placeholder="Search clips by tags (e.g., car, nature, luxury...)">
        </div>

        <div class="clip-grid" id="clipGrid">
            <p id="loadingMessage" style="color: #ccc; font-size: 1.2rem;">Loading clips...</p>
        </div>
        
        <div id="endOfClips" style="text-align: center; margin-top: 40px; color: #ccc; display: none;">
            <p>No more clips to load.</p>
        </div>

    </section>

    <footer>
        <div class="footer-about">
            <h3>Affluence Drives</h3>
            <p>Your destination for cinematic luxury content that captivates and inspires.</p>
        </div>
        <div class="footer-bottom">
            &copy; 2025 Affluence Drives. All rights reserved.
        </div>
    </footer>

    <script>
        // Get elements
        const clipGrid = document.getElementById('clipGrid');
        const clipSearchInput = document.getElementById('clipSearch');
        const loadingMessage = document.getElementById('loadingMessage');
        const endOfClipsMessage = document.getElementById('endOfClips');

        let allClipsData = []; // Stores all fetched clips
        let currentFilteredClips = []; // Stores clips currently being displayed/filtered
        const clipsPerPage = 9;
        let currentPage = 0;
        let isLoading = false; // To prevent multiple simultaneous loads

        // --- Dynamic Clip Loading from clips.json ---
        async function fetchClips() {
            if (isLoading) return;
            isLoading = true;
            loadingMessage.style.display = 'block'; // Show loading message

            try {
                // Ensure clips.json is in the same directory or adjust path
                const response = await fetch('clips.json'); 
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allClipsData = await response.json();
                // Sort by dateAdded (newest first). Make sure 'dateAdded' exists in your clips.json!
                allClipsData.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));

                // Initialize currentFilteredClips with all data for initial display
                currentFilteredClips = [...allClipsData];

                loadingMessage.style.display = 'none'; // Hide loading message
                loadInitialClips(); // Load the first set of clips
            } catch (error) {
                console.error('Error fetching clips:', error);
                loadingMessage.textContent = 'Failed to load clips. Please try again later.';
            } finally {
                isLoading = false;
            }
        }

        function loadInitialClips() {
            clipGrid.innerHTML = ''; // Clear existing clips
            currentPage = 0; // Reset page for initial load
            endOfClipsMessage.style.display = 'none'; // Hide end of clips message

            const initialClips = currentFilteredClips.slice(0, clipsPerPage);
            if (initialClips.length > 0) {
                initialClips.forEach(clip => {
                    clipGrid.appendChild(createClipCard(clip));
                });
                currentPage++;
            } else {
                clipGrid.innerHTML = '<p style="color: #ccc; font-size: 1.2rem;">No clips available.</p>';
                endOfClipsMessage.style.display = 'block';
            }

            // If there are more clips than the initial load, keep observing for infinite scroll
            if (currentFilteredClips.length > clipsPerPage) {
                observer.observe(sentinel);
            } else {
                observer.disconnect(); // No need for infinite scroll if all clips are loaded
            }
        }

        function loadMoreClips() {
            if (isLoading || currentFilteredClips.length <= (currentPage * clipsPerPage)) {
                // Stop if already loading or no more clips to load
                return;
            }

            isLoading = true;
            loadingMessage.style.display = 'block';

            const startIndex = currentPage * clipsPerPage;
            const endIndex = startIndex + clipsPerPage;
            const clipsToLoad = currentFilteredClips.slice(startIndex, endIndex);

            if (clipsToLoad.length === 0) {
                loadingMessage.style.display = 'none';
                endOfClipsMessage.style.display = 'block';
                isLoading = false;
                observer.disconnect(); // No more clips, stop observing
                return;
            }

            setTimeout(() => {
                clipsToLoad.forEach(clip => {
                    clipGrid.appendChild(createClipCard(clip));
                });
                currentPage++;
                isLoading = false;
                loadingMessage.style.display = 'none';
            }, 500); // Small delay to show loading
        }

        function createClipCard(clip) {
            const clipCard = document.createElement('div');
            clipCard.classList.add('clip-card');
            clipCard.setAttribute('data-id', clip.id);

            clipCard.innerHTML = `
                <div class="clip-card-inner">
                    <img src="${clip.thumbnail}" alt="${clip.title} Thumbnail">
                    <video loop muted playsinline preload="none" poster="${clip.thumbnail}">
                        <source src="${clip.videoSrc}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="hover-overlay">
                        <i class="fas fa-play play-icon"></i>
                        <a href="${clip.videoSrc}" download="${clip.title.replace(/\s+/g, '_')}.mp4" class="direct-download-btn">
                            <i class="fas fa-download"></i> Download
                        </a>
                    </div>
                    <div class="clip-card-info">
                        <h3>${clip.title}</h3>
                    </div>
                </div>
            `;

            const videoElement = clipCard.querySelector('video');

            clipCard.addEventListener('mouseenter', () => {
                videoElement.play().catch(error => console.log("Video autoplay prevented:", error));
            });

            clipCard.addEventListener('mouseleave', () => {
                videoElement.pause();
                videoElement.currentTime = 0;
            });

            // Modify the click listener for the entire card
            clipCard.addEventListener('click', (event) => {
                // If the click is specifically on the direct download button within the overlay,
                // let its default behavior (direct download) handle it.
                if (event.target.closest('.direct-download-btn')) {
                    return; 
                }

                // Otherwise, if any other part of the card is clicked (thumbnail, play icon, title),
                // trigger a direct download for the current clip.
                const downloadLink = document.createElement('a');
                downloadLink.href = clip.videoSrc; // Set the video source as the download link
                downloadLink.download = `${clip.title.replace(/\s+/g, '_')}.mp4`; // Set the filename for download
                document.body.appendChild(downloadLink); // Temporarily append to body to enable click
                downloadLink.click(); // Programmatically click the link
                document.body.removeChild(downloadLink); // Clean up the temporary link
            });

            return clipCard;
        }

        // --- Search Bar Logic ---
        clipSearchInput.addEventListener('keyup', () => {
            const searchTerm = clipSearchInput.value.toLowerCase().trim();
            clipGrid.innerHTML = ''; // Clear current grid

            if (searchTerm === '') {
                currentFilteredClips = [...allClipsData]; // Reset to all clips
                endOfClipsMessage.style.display = 'none';
            } else {
                currentFilteredClips = allClipsData.filter(clip => {
                    const tags = clip.tags.join(' ').toLowerCase();
                    const title = clip.title.toLowerCase();
                    return tags.includes(searchTerm) || title.includes(searchTerm);
                });
                if (currentFilteredClips.length === 0) {
                    clipGrid.innerHTML = '<p style="color: #ccc; font-size: 1.2rem;">No clips found matching your search.</p>';
                }
                endOfClipsMessage.style.display = 'none';
            }
            currentPage = 0; // Reset current page for new search/filtered results
            loadInitialClips(); // Load the first page of filtered results (or all if < clipsPerPage)
        });

        // --- Infinite Scroll Logic ---
        const sentinel = document.createElement('div');
        sentinel.id = 'scroll-sentinel';
        sentinel.style.height = '1px';
        clipGrid.parentNode.appendChild(sentinel);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !isLoading && currentFilteredClips.length > (currentPage * clipsPerPage)) {
                    loadMoreClips();
                }
            });
        }, {
            root: null,
            rootMargin: '0px 0px 200px 0px',
            threshold: 0.1
        });

        // Load clips when the page loads
        document.addEventListener('DOMContentLoaded', fetchClips);
    </script>
</body>
</html>
